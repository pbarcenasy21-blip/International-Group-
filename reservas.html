<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de reservas · AdminSeguro CTG</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="page-content">
<div id="crud"></div>
</div>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
const S = App.init('reservas', 'Gestión de reservas');
if (S) {
const nombreDe = (arr, id, k='nombre') => (arr.find(x => x.id === id) || {})[k] || '—';
Crud.init({
  entity: 'reservas', singular: 'reserva',
  columns: [
    { key: 'id', label: 'N.°', render: r => '#' + String(r.id).padStart(4, '0') },
    { label: 'Cliente', render: (r, d) => nombreDe(d.clientes, r.id_cliente) },
    { label: 'Servicio', render: (r, d) => nombreDe(d.servicios, r.id_servicio) },
    { key: 'fecha', label: 'Fecha', render: r => App.fmtDate(r.fecha) },
    { key: 'personas', label: 'Personas' },
    { key: 'estado', label: 'Estado', badge: true },
    { key: 'total', label: 'Total', render: r => App.fmtMoney(r.total) }
  ],
  filter: { key: 'estado', label: 'Estado', options: ['Pendiente', 'Confirmada', 'Cancelada'] },
  sort: (a, b) => b.id - a.id,
  fields: [
    { name: 'id_cliente', label: 'Cliente', type: 'select', numeric: true, required: true, full: true,
      options: d => d.clientes.map(c => ({ value: c.id, label: c.nombre + ' · ' + c.documento })) },
    { name: 'id_servicio', label: 'Servicio turístico', type: 'select', numeric: true, required: true, full: true,
      options: d => d.servicios.filter(s => s.estado === 'Activo').map(s => ({ value: s.id, label: s.nombre + ' (' + App.fmtMoney(s.precio) + ')' })) },
    { name: 'fecha', label: 'Fecha', type: 'date', required: true, notPast: true },
    { name: 'personas', label: 'Cantidad de personas', type: 'number', required: true, integer: true, min: 1, max: 50,
      validate: (v, vals, d) => {
        const inv = d.inventario.find(i => i.id_servicio === Number(vals.id_servicio));
        return inv && Number(v) > inv.cantidad_disponible ? 'Solo hay ' + inv.cantidad_disponible + ' cupo(s) disponibles para este servicio.' : '';
      } },
    { name: 'estado', label: 'Estado de la reserva', type: 'select', required: true, default: 'Pendiente', options: ['Pendiente', 'Confirmada', 'Cancelada'] },
    { name: 'total', label: 'Total estimado', computed: true,
      compute: (v, d) => { const s = d.servicios.find(x => x.id === Number(v.id_servicio)); return s && Number(v.personas) > 0 ? App.fmtMoney(s.precio * Number(v.personas)) : '—'; } }
  ],
  beforeSave: (rec, d) => { const s = d.servicios.find(x => x.id === rec.id_servicio); rec.total = s.precio * rec.personas; },
  label: (r, d) => '#' + String(r.id).padStart(4, '0') + ' · ' + nombreDe(d.clientes, r.id_cliente) + ' · ' + nombreDe(d.servicios, r.id_servicio),
  canDelete: () => 'Las reservas no se eliminan; cámbiales el estado a «Cancelada».'
});

}
</script>
</body>
</html>
