<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de clientes · AdminSeguro CTG</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="page-content">
<div id="crud"></div>
</div>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
const S = App.init('clientes', 'Gestión de clientes');
if (S) {

Crud.init({
  entity: 'clientes', singular: 'cliente',
  columns: [
    { key: 'nombre', label: 'Nombre' }, { key: 'documento', label: 'Documento' },
    { key: 'telefono', label: 'Teléfono' }, { key: 'correo', label: 'Correo' }
  ],
  sort: (a, b) => a.nombre.localeCompare(b.nombre),
  fields: [
    { name: 'nombre', label: 'Nombre completo', required: true, minLength: 3, full: true, placeholder: 'Ej. Ana María Torres' },
    { name: 'documento', label: 'Documento', required: true, unique: true, pattern: /^[A-Za-z0-9]{5,15}$/, msg: 'Usa de 5 a 15 letras o números, sin espacios ni signos.' },
    { name: 'telefono', label: 'Teléfono', required: true, pattern: /^\d{7,10}$/, msg: 'Ingresa solo números (7 a 10 dígitos).', placeholder: '3001234567' },
    { name: 'correo', label: 'Correo electrónico', type: 'email', required: true, full: true, placeholder: 'nombre@correo.com' }
  ],
  beforeSave: (rec, d, isNew) => { if (isNew) rec.fecha_registro = App.today(); },
  label: r => r.nombre + ' (' + r.documento + ')',
  canDelete: (r, d) => d.reservas.some(x => x.id_cliente === r.id) ? 'No se puede eliminar: el cliente tiene reservas asociadas.' : '',
  readOnlyNote: ''
});

}
</script>
</body>
</html>
