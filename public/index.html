<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · AdminSeguro CTG</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
<main class="login-card">
  <h1>AdminSeguro CTG</h1>
  <p class="sub">International Group · Cartagena de Indias</p>
  <div class="alert" id="loginError" role="alert" hidden></div>
  <form id="loginForm" novalidate>
    <div class="field" data-f="usuario">
      <label for="usuario">Usuario:</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username" autofocus>
      <small class="err" id="e_usuario" role="alert"></small>
    </div>
    <div class="field" data-f="password">
      <label for="password">Contraseña:</label>
      <div class="pass-wrap">
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="button" id="togglePass" aria-label="Mostrar contraseña">Mostrar</button>
      </div>
      <small class="err" id="e_password" role="alert"></small>
    </div>
    <button class="btn block" type="submit">Ingresar</button>
  </form>
  <p class="login-note">Entrar con cuenta personal</p>
  <div class="demo-box"><strong>Cuentas de demostración</strong><br>
    Administrador: <code>admin</code> / <code>Admin123</code><br>
    Trabajador: <code>operador</code> / <code>Operador123</code></div>
</main>
<script src="js/app.js"></script>
<script>
  if (typeof App !== 'undefined' && App.session()) {
    location.replace('dashboard.html');
  }

  const form = document.getElementById('loginForm');
  const inpUser = document.getElementById('usuario');
  const inpPass = document.getElementById('password');
  const btnToggle = document.getElementById('togglePass');
  const errBox = document.getElementById('loginError');

  btnToggle.addEventListener('click', () => {
    const show = inpPass.type === 'password';
    inpPass.type = show ? 'text' : 'password';
    btnToggle.textContent = show ? 'Ocultar' : 'Mostrar';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.hidden = true;
    errBox.textContent = '';

    const u = inpUser.value.trim();
    const p = inpPass.value;

    if (!u || !p) {
      errBox.textContent = 'Ingresa tu usuario y contraseña.';
      errBox.hidden = false;
      return;
    }

    const res = await App.login(u, p);
    if (!res.ok) {
      errBox.textContent = res.msg;
      errBox.hidden = false;
      return;
    }

    location.href = 'dashboard.html';
  });
</script>
</body>
</html>
