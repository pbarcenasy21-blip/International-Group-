<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historial de actividad · AdminSeguro CTG</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="page-content">
<div id="crud"></div>
</div>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
const S = App.init('historial', 'Historial de actividad');
if (S) {

Crud.init({
  entity: 'historial', singular: 'registro', noActions: true,
  columns: [
    { key: 'fecha_hora', label: 'Fecha y hora', render: r => App.fmtDateTime(r.fecha_hora) },
    { key: 'usuario', label: 'Usuario' }, { key: 'accion', label: 'Acción' }, { key: 'detalle', label: 'Detalle' }
  ],
  sort: (a, b) => b.id - a.id,
  fields: [{ name: 'x', label: 'x' }]
});

}
</script>
</body>
</html>
