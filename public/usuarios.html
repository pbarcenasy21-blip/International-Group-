<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios y permisos · AdminSeguro CTG</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="page-content">
<div id="crud"></div>
</div>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
const S = App.init('usuarios', 'Usuarios y permisos');
if (S) {

Crud.init({
  entity: 'usuarios', singular: 'usuario',
  columns: [
    { key: 'nombre', label: 'Nombre' }, { key: 'usuario', label: 'Usuario' }, { key: 'correo', label: 'Correo' },
    { label: 'Rol', render: r => App.ROLES[r.id_rol] }, { key: 'estado', label: 'Estado', badge: true }
  ],
  sort: (a, b) => a.id - b.id,
  fields: [
    { name: 'nombre', label: 'Nombre completo', required: true, minLength: 3, full: true },
    { name: 'usuario', label: 'Usuario', required: true, unique: true, pattern: /^[a-z0-9._-]{4,20}$/i, msg: 'De 4 a 20 caracteres: letras, números, punto, guion o guion bajo.' },
    { name: 'id_rol', label: 'Rol', type: 'select', numeric: true, required: true, options: [{ value: 1, label: 'Administrador' }, { value: 2, label: 'Trabajador autorizado' }] },
    { name: 'correo', label: 'Correo electrónico', type: 'email', required: true, unique: true, full: true },
    { name: 'password', label: 'Contraseña', type: 'password', required: m => m === 'new', full: true,
      pattern: /^(?=.*[A-Za-z])(?=.*\d).{8,}$/, msg: 'Mínimo 8 caracteres, con letras y números. (En edición, déjala vacía para no cambiarla).' },
    { name: 'estado', label: 'Estado de la cuenta', type: 'select', required: true, default: 'Activo', options: ['Activo', 'Inactivo'],
      validate: (v, vals, d, ed) => ed && ed.id === App.session().id && v === 'Inactivo' ? 'No puedes desactivar tu propia cuenta.' : '' }
  ],
  label: r => r.usuario + ' (' + App.ROLES[r.id_rol] + ')',
  canDelete: () => 'Las cuentas no se eliminan: desactívalas cambiando su estado.'
});

}
</script>
</body>
</html>
