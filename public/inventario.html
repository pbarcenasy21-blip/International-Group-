<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario de servicios · AdminSeguro CTG</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="page-content">
  <div id="crud"></div>
</div>
<script src="js/app.js"></script>
<script src="js/crud.js"></script>
<script>
(async () => {
  const S = await App.init('inventario', 'Inventario de servicios');
  if (!S) return;

  const nombreDe = (arr, id, k='nombre') => (arr.find(x => x.id === id) || {})[k] || '—';
  Crud.init({
    entity: 'inventario', singular: 'registro de inventario',
    columns: [
      { label: 'Servicio', render: (r, d) => nombreDe(d.servicios, r.id_servicio) },
      { key: 'cantidad_disponible', label: 'Cupos disponibles' },
      { key: 'fecha_actualizacion', label: 'Última actualización', render: r => App.fmtDateTime(r.fecha_actualizacion) }
    ],
    readOnlyNote: 'Tu rol solo permite consultar el inventario.',
    fields: [
      { name: 'id_servicio', label: 'Servicio', type: 'select', numeric: true, required: true, unique: true, full: true,
        options: d => d.servicios.map(s => ({ value: s.id, label: s.nombre })) },
      { name: 'cantidad_disponible', label: 'Cupos disponibles', type: 'number', required: true, integer: true, min: 0, max: 1000 }
    ],
    beforeSave: rec => { rec.fecha_actualizacion = new Date().toISOString(); },
    label: (r, d) => nombreDe(d.servicios, r.id_servicio) + ': ' + r.cantidad_disponible + ' cupos'
  });
})();
</script>
</body>
</html>
